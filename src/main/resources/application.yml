spring:
  application:
    name: canchaya-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/canchaya}
    username: ${DB_USER:canchaya}
    password: ${DB_PASSWORD:canchaya}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: America/Bogota
  data:
    web:
      pageable:
        max-page-size: 100

server:
  port: ${PORT:8080}
  error:
    include-message: always

app:
  zona-horaria: America/Bogota
  jwt:
    # Solo para desarrollo local: en cualquier otro entorno se debe definir JWT_SECRET (mínimo 32 caracteres)
    secret: ${JWT_SECRET:canchaya-clave-de-desarrollo-cambiar-en-produccion-2026}
    expiration: ${JWT_EXPIRATION:86400000}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
