services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: canchaya
      POSTGRES_USER: ${DB_USER:-canchaya}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-canchaya}
      TZ: America/Bogota
    ports:
      - "5432:5432"
    volumes:
      - canchaya-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/canchaya
      DB_USER: ${DB_USER:-canchaya}
      DB_PASSWORD: ${DB_PASSWORD:-canchaya}
      JWT_SECRET: ${JWT_SECRET:-canchaya-clave-de-desarrollo-cambiar-en-produccion-2026}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  canchaya-data:
